name: High-Speed Windows RDP (Azure VM via Tailscale)

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Enter your Tailscale Auth Key (tskey-auth-...)'
        required: true
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Windows Remote Desktop (RDP) & Configure User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin "Password123!"
          net localgroup "Remote Desktop Users" runneradmin /add 2>&1 | Out-Null
          $LASTEXITCODE = 0

      - name: Install & Connect Tailscale
        env:
          TS_AUTHKEY: ${{ github.event.inputs.tailscale_key }}
        run: |
          Write-Output "::add-mask::$env:TS_AUTHKEY"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
          & $tailscaleExe up --authkey="$env:TS_AUTHKEY" --accept-routes
          Start-Sleep -Seconds 3
          $ip = (& $tailscaleExe ip -4)

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "WINDOWS SERVER RDP IS READY!" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RDP IP Address : $ip" -ForegroundColor Yellow
          Write-Host "Username       : runneradmin" -ForegroundColor White
          Write-Host "Password       : Password123!" -ForegroundColor White
          Write-Host "Duration       : 6 Hours (Max Limit)" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Cyan

      - name: Keep-Alive Runner (Up to 6 Hours Active)
        run: |
          $totalMinutes = 350
          for ($i = 1; $i -le $totalMinutes; $i++) {
              Start-Sleep -Seconds 60
              if ($i % 10 -eq 0) {
                  Write-Host "Windows RDP Active: $i / $totalMinutes minutes"
              }
          }
